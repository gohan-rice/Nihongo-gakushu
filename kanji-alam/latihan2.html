    <div class="container">
        <div class="hero">
            <h1>LATIHAN 2</h1>
            <h2>Isi Kotak Kosong</h2>
            <p>Lengkapi kosakata berikut dengan kanji yang tepat.</p>
        </div>

        <div class="latihan-besar-container jp-text">
            <div class="latihan-item"><span class="k-box" data-default="□" data-answer="手">□</span>紙</div>
            <div class="latihan-item"><span class="k-box" data-default="□" data-answer="目">□</span>次</div>
            <div class="latihan-item"><span class="k-box" data-default="□□" data-answer="上手">□□</span>な / <span class="k-box" data-default="□□" data-answer="下手">□□</span>な</div>
            <div class="latihan-item">不<span class="k-box" data-default="□" data-answer="足">□</span></div>
            <div class="latihan-item"><span class="k-box" data-default="□" data-answer="米">□</span>国</div>
            <div class="latihan-item">北<span class="k-box" data-default="□" data-answer="米">□</span></div>
            <div class="latihan-item">南<span class="k-box" data-default="□" data-answer="米">□</span></div>
            <div class="latihan-item"><span class="k-box" data-default="□" data-answer="石川">□</span>県</div>
            <div class="latihan-item"><span class="k-box" data-default="□" data-answer="竹/石">□</span>さん</div>
        </div>

        <div style="text-align: center;">
            <button id="btn-tampilkan" onclick="toggleKanjiBoxes(this)">Tampilkan Jawaban</button>
        </div>

    </div>
