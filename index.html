<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongo-gakushu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .bab-button {
            display: block;
            text-align: center;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .bab-button:hover {
            background-color: #45a049;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <h1>Nihongo-gakushu</h1>
    <p>Materi Ajar Jepang</p>

    <div class="button-container">
        <a href="bab6.html" class="bab-button">Bab 6</a>
